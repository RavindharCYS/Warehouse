<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="https://exploiteye.in/assets/favicon/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#4a3cb5" />
    <meta name="description" content="Rice Warehouse Management System | அரிசி கிடங்கு மேலாண்மை" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RiceWH" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&family=Noto+Sans+Tamil:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Rice Warehouse Manager | அரிசி கிடங்கு</title>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      #splash-screen {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        font-family: 'DM Sans', sans-serif;
        transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
      }

      #splash-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }

      .splash-logo {
        width: 90px; height: 90px;
        margin-bottom: 28px;
        animation: logoPulse 2s ease-in-out infinite, logoEntry 0.6s ease-out both;
      }

      .splash-logo img {
        width: 90px;
        height: 90px;
        object-fit: contain;
      }

      @keyframes logoEntry {
        0% { opacity: 0; transform: scale(0.6) translateY(20px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }

      @keyframes logoPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      .splash-title {
        color: #1a1a2e;
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 4px;
        animation: fadeUp 0.6s ease-out 0.2s both;
      }

      .splash-subtitle {
        font-family: 'Noto Sans Tamil', sans-serif;
        color: #6b5ccd;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 40px;
        animation: fadeUp 0.6s ease-out 0.4s both;
      }

      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(15px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      .splash-spinner {
        width: 36px; height: 36px;
        border: 3px solid rgba(107, 92, 205, 0.12);
        border-top-color: #6b5ccd;
        border-radius: 50%;
        animation: spin 0.8s linear infinite, fadeUp 0.6s ease-out 0.6s both;
        margin-bottom: 16px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .splash-progress {
        width: 160px; height: 3px;
        background: rgba(107, 92, 205, 0.1);
        border-radius: 3px;
        overflow: hidden;
        animation: fadeUp 0.6s ease-out 0.8s both;
      }

      .splash-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #6b5ccd, #8a64e6);
        border-radius: 3px;
        animation: progressFill 2.5s ease-in-out 1s forwards;
      }

      @keyframes progressFill {
        0% { width: 0%; }
        30% { width: 35%; }
        60% { width: 60%; }
        80% { width: 80%; }
        100% { width: 95%; }
      }

      .splash-text {
        color: #9a94b8;
        font-size: 12px;
        font-weight: 500;
        margin-top: 16px;
        animation: fadeUp 0.6s ease-out 1s both, blink 2s ease-in-out 1.5s infinite;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div id="splash-screen">
        <div class="splash-logo">
          <img src="%PUBLIC_URL%/logo.png" alt="Rice Warehouse" />
        </div>
        <div class="splash-title">Rice Warehouse</div>
        <div class="splash-subtitle">அரிசி கிடங்கு மேலாண்மை</div>
        <div class="splash-spinner"></div>
        <div class="splash-progress">
          <div class="splash-progress-bar"></div>
        </div>
        <div class="splash-text">Loading...</div>
      </div>
    </div>
  </body>
</html>
