services:
  - type: web
    name: rice-warehouse-backend
    env: python
    region: singapore          # closest to Chennai / ap-south
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false            # paste Supabase URL in Render dashboard
      - key: SECRET_KEY
        sync: false
      - key: DEFAULT_ADMIN_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false            # set to your Vercel URL after deploy
      - key: PYTHON_VERSION
        value: "3.11.9"
